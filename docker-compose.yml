# Full platform stack for J26-SE-325.
#
#   docker compose up --build      then open http://localhost:3000
#
# Components 2-4 are reserved below as commented blocks so a teammate uncomments rather than
# redesigns. Ports are assigned by convention: 8000 + component number, with the shared
# platform service on 8100.

services:
  # --- shared services ------------------------------------------------------------------
  platform:
    build:
      context: ./backend/Platform
    ports:
      - "8100:8100"
    environment:
      # Shared with every component so each can VERIFY tokens this service ISSUES, without
      # calling back here on each request. The service refuses to start if it is unset,
      # short, or still the placeholder from .env.example.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in a repo-root .env — see .env.example}
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      DATABASE_URL: sqlite:////app/artifacts/platform.sqlite
    volumes:
      # Users and portfolios must outlive the container, or every restart wipes the accounts.
      - platform_data:/app/artifacts
    restart: unless-stopped

  component1:
    build:
      context: ./backend/Portfolio-Optimization
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in a repo-root .env}
      AUTH_REQUIRED: "true"
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_ENABLED: "true"
      MLFLOW_TRACKING_URI: sqlite:///artifacts/mlflow.db
    volumes:
      # The model registry lives here; Component 3 anchors model_version on-chain, so a
      # version that vanished on restart would break its provenance chain.
      - ./backend/Portfolio-Optimization/artifacts:/app/artifacts
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Baked in at build time: NEXT_PUBLIC_* is inlined into the client bundle, never read
        # at runtime. These are the URLs the BROWSER uses, so they are localhost — not the
        # compose service names, which only resolve inside the network.
        NEXT_PUBLIC_PLATFORM_URL: http://localhost:8100
        NEXT_PUBLIC_PORTFOLIO_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - platform
      - component1
    restart: unless-stopped

  # --- supporting infrastructure ---------------------------------------------------------
  kafka:
    # KRaft mode, no ZooKeeper. One broker is enough: the TAF calls for a local event bus,
    # not a production cluster.
    image: bitnami/kafka:3.7
    ports:
      - "9094:9094"
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    volumes:
      - kafka_data:/bitnami/kafka

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    ports:
      - "5000:5000"
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlruns/mlflow.db
      --default-artifact-root /mlruns/artifacts
    volumes:
      - ./backend/Portfolio-Optimization/artifacts/mlruns:/mlruns
    restart: unless-stopped

  # --- teammates' components ---------------------------------------------------------------
  # None of these add a file to anyone's folder. Each runs from a stock image with the
  # component bind-mounted, so the only thing this file knows about them is how to start
  # them and where to check they are alive.
  #
  # Every one is `restart: unless-stopped` and nothing depends_on them: a teammate's service
  # failing to start must never take the rest of the platform down with it.

  component2:                      # Fraud Detection  (Dhushanthini R)
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./backend/Fraud-Detection:/app
    # Its detection logic is pure standard library -- fastapi, uvicorn and pydantic are the
    # whole dependency list -- so installing at start costs seconds and needs no Dockerfile.
    command: >
      sh -c "pip install --quiet --no-cache-dir -r requirements.txt &&
             uvicorn app:app --host 0.0.0.0 --port 8001"
    ports: ["8001:8001"]
    environment:
      ALLOWED_ORIGINS: http://localhost:3000
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  component3:                      # Blockchain Auditability  (Abeysekara W C S M)
    image: node:20-slim
    working_dir: /app
    volumes:
      - ./backend/Blockchain-Auditability/backend:/app
    # PORT is read from the environment by its index.js, so it runs on 8002 without any
    # change to the source.
    command: sh -c "npm install --silent && node src/index.js"
    ports: ["8002:8002"]
    environment:
      PORT: "8002"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:8002/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  component4:                      # Agentic Assistance  (W V A D K Chamara)
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./backend/Agentic-Assistance:/app
    # Its own requirements.txt, rather than a guessed package list. An earlier version of
    # this file installed langchain-openai and shap: neither is used by the service, and it
    # omitted langchain-ollama, which is.
    command: >
      sh -c "pip install --quiet --no-cache-dir -r requirements.txt &&
             uvicorn main:app --host 0.0.0.0 --port 8003"
    ports: ["8003:8003"]
    environment:
      ALLOWED_ORIGINS: http://localhost:3000
      # The agent talks to OLLAMA, not OpenAI -- agent.py uses ChatOllama. Inside a
      # container "localhost" is the container, so it has to be pointed at the host
      # explicitly or every chat call fails with a connection error.
      OLLAMA_HOST: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8003/health')\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    restart: unless-stopped

volumes:
  platform_data:
  kafka_data:
