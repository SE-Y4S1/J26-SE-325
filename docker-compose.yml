# Full platform stack for J26-SE-325.
#
#   docker compose up --build      then open http://localhost:3000
#
# Components 2-4 are reserved below as commented blocks so a teammate uncomments rather than
# redesigns. Ports are assigned by convention: 8000 + component number, with the shared
# platform service on 8100.

services:
  # --- shared services ------------------------------------------------------------------
  platform:
    build:
      context: ./backend/Platform
    ports:
      - "8100:8100"
    environment:
      # Shared with every component so each can VERIFY tokens this service ISSUES, without
      # calling back here on each request. The service refuses to start if it is unset,
      # short, or still the placeholder from .env.example.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in a repo-root .env — see .env.example}
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      DATABASE_URL: sqlite:////app/artifacts/platform.sqlite
      # Executions run Component 1 plans through Components 2 and 3 (service/pipeline.py).
      # In-network names; if either is down, executions are HELD, never run unscreened.
      FRAUD_SERVICE_URL: http://component2:8001
      AUDIT_SERVICE_URL: http://component3:8002
    volumes:
      # Users and portfolios must outlive the container, or every restart wipes the accounts.
      - platform_data:/app/artifacts
    restart: unless-stopped

  component1:
    build:
      context: ./backend/Portfolio-Optimization
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in a repo-root .env}
      AUTH_REQUIRED: "true"
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_ENABLED: "true"
      MLFLOW_TRACKING_URI: sqlite:///artifacts/mlflow.db
    volumes:
      # The model registry lives here; Component 3 anchors model_version on-chain, so a
      # version that vanished on restart would break its provenance chain.
      - ./backend/Portfolio-Optimization/artifacts:/app/artifacts
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Baked in at build time: NEXT_PUBLIC_* is inlined into the client bundle, never read
        # at runtime. These are the URLs the BROWSER uses, so they are localhost — not the
        # compose service names, which only resolve inside the network.
        NEXT_PUBLIC_PLATFORM_URL: http://localhost:8100
        NEXT_PUBLIC_PORTFOLIO_URL: http://localhost:8000
        NEXT_PUBLIC_FRAUD_URL: http://localhost:8001
        NEXT_PUBLIC_AUDIT_URL: http://localhost:8002
        NEXT_PUBLIC_ASSISTANT_URL: http://localhost:8003
    ports:
      - "3000:3000"
    depends_on:
      - platform
    restart: unless-stopped

  # --- supporting infrastructure ---------------------------------------------------------
  kafka:
    # KRaft mode, no ZooKeeper. One broker is enough: the TAF calls for a local event bus,
    # not a production cluster.
    #
    # The official Apache image, not bitnami/kafka -- Bitnami withdrew its public catalogue
    # in 2025 and `bitnami/kafka:3.7` no longer resolves on Docker Hub. The variables differ:
    # Apache takes plain Kafka property names (KAFKA_NODE_ID), Bitnami infixed them
    # (KAFKA_CFG_NODE_ID), so this is the same broker described in the other dialect.
    image: apache/kafka:3.7.2
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: "0"
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # A single broker cannot replicate anything; the defaults of 3 leave the internal
      # topics permanently under-replicated and consumer groups never stabilise.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: j26se325LocalBusAAA
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    volumes:
      - kafka_data:/var/lib/kafka/data

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    ports:
      - "5000:5000"
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlruns/mlflow.db
      --default-artifact-root /mlruns/artifacts
    volumes:
      - ./backend/Portfolio-Optimization/artifacts/mlruns:/mlruns
    restart: unless-stopped

  # --- teammates' components ---------------------------------------------------------------
  # None of these add a file to anyone's folder. Each runs from a stock image with the
  # component bind-mounted, so the only thing this file knows about them is how to start
  # them and where to check they are alive.
  #
  # Every one is `restart: unless-stopped` and nothing depends_on them: a teammate's service
  # failing to start must never take the rest of the platform down with it.

  component2:                      # Fraud Detection  (Dhushanthini R)
    # Her own Dockerfile: the engine is PyTorch (LSTM autoencoder + GNN), so the CPU torch
    # wheel is installed at build time rather than on every start.
    build:
      context: ./backend/Fraud-Detection
    ports: ["8001:8001"]
    environment:
      FRAUD_API_PORT: "8001"
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    volumes:
      # A bundle trained with scripts/train_benchmark.py lands here and is loaded on start;
      # without one the service answers with the labelled heuristic-untrained scorer.
      - ./backend/Fraud-Detection/artifacts:/app/artifacts
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  component3:                      # Blockchain Auditability  (Abeysekara W C S M)
    image: node:20-slim
    working_dir: /app
    volumes:
      - ./backend/Blockchain-Auditability/backend:/app
    # PORT is read from the environment by its index.js, so it runs on 8002 without any
    # change to the source.
    command: sh -c "npm install --silent && node src/index.js"
    ports: ["8002:8002"]
    environment:
      PORT: "8002"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:8002/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  # --- Ollama Local LLM Engine -----------------------------------------------------------
  # Internal only: port 11434 is exposed to the Docker network but NOT published to host
  # to prevent port conflicts with any native Ollama instance running on the host.
  ollama:
    image: ollama/ollama:latest
    container_name: finagent-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    expose:
      - "11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # --- Ollama Model Initializer ----------------------------------------------------------
  # Automatically downloads llama3.2:3b if not already present in the persistent volume.
  # Exits cleanly with code 0 once the model is confirmed available.
  ollama-model-pull:
    image: ollama/ollama:latest
    container_name: finagent-ollama-pull
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Ollama service to become healthy..."
        until ollama list > /dev/null 2>&1; do
          sleep 1
        done
        echo "Checking and pulling llama3.2:3b model into persistent storage..."
        ollama pull llama3.2:3b
        echo "llama3.2:3b model is ready for Component 4."
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  component4:                      # Agentic Assistance  (W V A D K Chamara)
    build:
      context: ./backend/Agentic-Assistance
    ports: ["8003:8003"]
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in a repo-root .env}
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      OLLAMA_HOST: http://ollama:11434
      PLATFORM_SERVICE_URL: http://platform:8100
      AUDIT_SERVICE_URL: http://component3:8002
      FRAUD_SERVICE_URL: http://component2:8001
      PORTFOLIO_OPTIMIZATION_URL: http://component1:8000
    depends_on:
      ollama:
        condition: service_healthy
      ollama-model-pull:
        condition: service_completed_successfully
      platform:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8003/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  platform_data:
  kafka_data:
  ollama_data:
