[project]
name = "platform-service"
version = "0.1.0"
description = "Shared platform service for J26-SE-325: identity and portfolio storage for all four components."
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "email-validator>=2.2",          # pydantic EmailStr needs this at runtime
    "sqlalchemy>=2.0",
    "pyjwt>=2.9",
    # argon2 rather than bcrypt: it is the current password-hashing recommendation and has
    # no silent 72-byte truncation, which bcrypt does have and which turns a long passphrase
    # into a weaker secret without any error.
    "passlib[argon2]>=1.7.4",
    "argon2-cffi>=23.1",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[tool.uv]
# Virtual project: the module tree is flat at the repo root and imported via rootdir, the
# same convention as backend/Portfolio-Optimization.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
