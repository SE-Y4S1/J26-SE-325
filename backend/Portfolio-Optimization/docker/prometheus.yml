# Scrapes the FastAPI /metrics endpoint exposed by prometheus-fastapi-instrumentator.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: component1_portfolio
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          component: portfolio_optimization
          project: J26-SE-325
