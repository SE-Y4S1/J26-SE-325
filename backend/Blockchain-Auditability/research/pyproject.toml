[project]
name = "c3-assurance-research"
version = "0.1.0"
description = "IEEE-CIS evaluation of Component 3's AI Decision Assurance Engine against simpler decision-routing baselines."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8.2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
