# Dedicated Compose stack for Component 4 (Agentic Assistance), Frontend, Ollama,
# and required shared platform & teammate services (Platform on 8100, Component 3 on 8002).
#
# Startup:
#   docker compose -f docker-compose.assistant.yml up --build -d
#
# Shutdown:
#   docker compose -f docker-compose.assistant.yml down
#
# This configuration avoids starting heavy unrelated services (Kafka, MLflow, Component 1)
# while ensuring full end-to-end functionality of the Assistant, Trust Panel, and Explanation screens.

services:
  # --- Shared Platform Service (Auth, User & Portfolio Store) ----------------------------
  platform:
    build:
      context: ./backend/Platform
    ports:
      - "8100:8100"
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in a repo-root .env — see .env.example}
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      DATABASE_URL: sqlite:////app/artifacts/platform.sqlite
    volumes:
      - platform_data:/app/artifacts
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8100/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # --- Component 3: Blockchain Auditability Service --------------------------------------
  component3:
    image: node:20-slim
    working_dir: /app
    volumes:
      - ./backend/Blockchain-Auditability:/app
    command: sh -c "npm install --silent && node src/index.js"
    ports:
      - "8002:8002"
    environment:
      PORT: "8002"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:8002/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s
    restart: unless-stopped

  # --- Component 2: Fraud Detection Service (Optional / Safe Fallback) -------------------
  # Component 4 has built-in safe fallback and timeout if Component 2 is offline.
  component2:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./backend/Fraud-Detection:/app
    command: >
      sh -c "pip install --quiet --no-cache-dir -r requirements.txt &&
             uvicorn app:app --host 0.0.0.0 --port 8001"
    ports:
      - "8001:8001"
    environment:
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # --- Ollama Local LLM Engine -----------------------------------------------------------
  # Internal only: port 11434 is exposed to the Docker network but NOT published to host
  # to prevent port conflicts with any native Ollama instance running on the host.
  ollama:
    image: ollama/ollama:latest
    container_name: finagent-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    expose:
      - "11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # --- Ollama Model Initializer ----------------------------------------------------------
  # Automatically downloads llama3.2:3b if not already present in the persistent volume.
  # Exits cleanly with code 0 once the model is confirmed available.
  ollama-model-pull:
    image: ollama/ollama:latest
    container_name: finagent-ollama-pull
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Ollama service to become healthy..."
        until ollama list > /dev/null 2>&1; do
          sleep 1
        done
        echo "Checking and pulling llama3.2:3b model into persistent storage..."
        ollama pull llama3.2:3b
        echo "llama3.2:3b model is ready for Component 4."
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # --- Component 4: Agentic Assistance & Responsible AI ----------------------------------
  component4:
    build:
      context: ./backend/Agentic-Assistance
    ports:
      - "8003:8003"
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in a repo-root .env}
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      OLLAMA_HOST: http://ollama:11434
      PLATFORM_SERVICE_URL: http://platform:8100
      AUDIT_SERVICE_URL: http://component3:8002
      FRAUD_SERVICE_URL: http://component2:8001
    depends_on:
      ollama:
        condition: service_healthy
      ollama-model-pull:
        condition: service_completed_successfully
      platform:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8003/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # --- Frontend: Next.js Web Application -------------------------------------------------
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_PLATFORM_URL: http://localhost:8100
        NEXT_PUBLIC_PORTFOLIO_URL: http://localhost:8000
        NEXT_PUBLIC_FRAUD_URL: http://localhost:8001
        NEXT_PUBLIC_AUDIT_URL: http://localhost:8002
        NEXT_PUBLIC_ASSISTANT_URL: http://localhost:8003
    ports:
      - "3000:3000"
    depends_on:
      platform:
        condition: service_started
      component4:
        condition: service_started
    restart: unless-stopped

volumes:
  platform_data:
  ollama_data:
